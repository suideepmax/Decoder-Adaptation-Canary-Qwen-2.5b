# Matched-protocol LoRA arm (truncated exposure), the LoRA-adaptation-scope
# counterpart to matched_full_decoder.yaml. Identical initialization,
# optimizer class, data, evaluation set, and regularization -- the only
# intended difference from the full-decoder arm is adaptation scope (LoRA
# r=128 on q_proj/v_proj vs. the entire decoder unfrozen). A second version
# of this arm trained to the full matched 27.72-true-epoch exposure is at
# matched_lora_full9200.yaml.
#
# Initialization: both model.load_released_pretrained and model.lora are
# set. The released model's own trained weights are loaded onto this run's
# LoRA-wrapped parameter names (mapping merged reference weights onto
# `llm.base_model.model.<rest>`, with LoRA-targeted linear layers' base
# weight further nested under `<rest>.base_layer.<weight/bias>`), leaving
# this run's own LoRA adapters at their fresh cold-start initialization
# (zero initial delta). This means both arms of the comparison start from
# identical decoder weights at step 0 -- this run's LoRA adapters contribute
# nothing until trained, matching standard LoRA cold-start convention,
# rather than transferring the released model's own already-trained LoRA
# delta (which would not be a fair "fresh adaptation" starting point).
#
# prevent_freeze_params must include the lora_ keep-pattern below: the
# training script's freeze-parameter logic has no LoRA-specific
# special-casing, and applies the `^llm\.+$` freeze pattern to LoRA adapter
# parameter names too (since they are nested under `llm.base_model.model...`).
# Without this override, every LoRA adapter parameter would be silently
# frozen, producing a non-learning LoRA arm with no visible error. With it
# set as below, this configuration has exactly 27,789,312 trainable
# parameters (LoRA adapters plus the bridge-layer parameter group).
#
# lora_dropout=0.1, r=128, alpha=256, target_modules=[q_proj, v_proj] match
# the released model's own embedded LoRA configuration. The spec_augment
# block is identical to the full-decoder arm's (symmetric regularization,
# so this axis is controlled-for rather than a confound between arms).
#
# model.optimizer.lr (5e-4) was selected via a short learning-rate probe
# (three candidates, 375 steps each, full 915-sample development-set WER):
# 1e-4 reached 37.66% WER, 3e-4 reached 30.01%, 5e-4 reached 30.04%.
# WER(3e-4) and WER(5e-4) are statistically indistinguishable at this
# sample size (0.03pp apart), but validation loss was still improving at
# 5e-4 with no plateau, so it was selected as the stronger optimization
# signal.
#
# Training length: this arm is deliberately truncated to 3700 steps
# (~11.15 true epochs at this recipe's rate), rather than the full 9200
# steps (27.72 true epochs) used for the full-decoder arm, to prioritize
# compute toward the exposure range (roughly 3-11 true epochs) where the
# comparison is most informative, given a fixed compute budget -- LoRA's
# behavior at the full 27.72-epoch endpoint was already characterized by
# this project's original LoRA baseline configuration. A second run of
# this same LoRA configuration to the full 9200-step, exposure-matched
# target is provided separately (matched_lora_full9200.yaml) for the
# fully matched comparison.

model:
  pretrained_llm: Qwen/Qwen3-1.7B
  pretrained_asr: nvidia/canary-1b-flash
  pretrained_weights: True
  load_released_pretrained: True

  freeze_params:
    - "^llm\\..+$"
    - "^embed_tokens\\..+$"
    - "^perception\\.preprocessor\\..+$"
    - "^perception\\.encoder\\..+$"
  prevent_freeze_params:
    - "^.+\\.lora_.+$"

  lora:
    task_type: CAUSAL_LM
    r: 128
    lora_alpha: 256
    lora_dropout: 0.1
    target_modules: ["q_proj", "v_proj"]

  prompt_format: qwen
  audio_locator_tag: "<|audioplaceholder|>"

  gradient_clip_val_unscaled: 1000.0

  perception:
    target: nemo.collections.speechlm2.modules.perception.AudioPerceptionModule
    output_dim: 2048
    modality_adapter:
      _target_: nemo.collections.speechlm2.modules.perception.IdentityConnector
      d_model: 1024
    spec_augment:
      _target_: nemo.collections.asr.modules.SpectrogramAugmentation
      freq_masks: 2
      time_masks: 10
      freq_width: 27
      time_width: 5

  optimizer:
    _target_: master_weight_adamw.MasterWeightAdamW
    lr: 5e-4
    bridge_lr: 5e-5
    betas: [0.9, 0.98]
    weight_decay: 1e-2
    eps: 1e-8
    loss_scale: 1024.0

  lr_scheduler:
    _target_: nemo.core.optim.lr_scheduler.CosineAnnealing
    warmup_steps: 185
    min_lr: 1e-7
    max_steps: ${trainer.max_steps}

trainer:
  devices: 4
  accelerator: gpu
  num_nodes: 1
  precision: 16-true
  logger: False
  enable_checkpointing: False
  use_distributed_sampler: False
  max_steps: 3700
  limit_train_batches: 1000
  limit_val_batches: 200
  log_every_n_steps: 50
  num_sanity_val_steps: 1
  accumulate_grad_batches: 8
  strategy:
    _target_: lightning.pytorch.strategies.ModelParallelStrategy
    tensor_parallel_size: 1
    data_parallel_size: 4

data:
  train_ds:
    sample_rate: 16000
    prompt_format: ${model.prompt_format}
    token_equivalent_duration: 0.08
    input_cfg:
      - type: lhotse_as_conversation
        cuts_path: /home/kotasthane/canary-ft/data/train_cuts_v2.jsonl.gz
        audio_locator_tag: ${model.audio_locator_tag}
        tags:
          context: "Transcribe the following:"
    seed: 1234
    shuffle: true
    shard_seed: "randomized"
    num_workers: 1
    batch_size: 1

  validation_ds:
    prompt_format: ${model.prompt_format}
    token_equivalent_duration: 0.08
    datasets:
      uwb_atcc_dev:
        input_cfg:
          - type: lhotse_as_conversation
            cuts_path: /home/kotasthane/canary-ft/data/dev_cuts.jsonl.gz
            audio_locator_tag: ${model.audio_locator_tag}
            tags:
              context: "Transcribe the following:"
    sample_rate: 16000
    batch_size: 1
    seed: 1234
    shard_seed: 1234

exp_manager:
  exp_dir: null
  explicit_log_dir: /home/kotasthane/canary-ft/experiments_matched_lora/
  name: canary_uwb_atcc_matched_lora
  create_tensorboard_logger: False
  create_checkpoint_callback: true
  use_datetime_version: true
  max_time_per_run: "04:00:00:00"
  resume_if_exists: false
  resume_ignore_no_checkpoint: true
  create_wandb_logger: false
  create_early_stopping_callback: true
  early_stopping_callback_params:
    monitor: val_loss
    mode: min
    min_delta: 0.0
    patience: 100000
    check_finite: true
    divergence_threshold: 50.0
  checkpoint_callback_params:
    filename: "{step}"
    monitor: val_loss
    mode: min
    every_n_train_steps: 925
    every_n_epochs: null
    save_top_k: -1
    always_save_nemo: false
    save_nemo_on_train_end: false
